name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install small public model for real embedding test
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python setup_model.py
      - name: Test without private documents
        env:
          ORGANIZER_TEST_MODEL: data/model
        run: python -m unittest discover -s tests -v
